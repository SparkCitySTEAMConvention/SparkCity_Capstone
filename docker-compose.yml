# docker-compose.yml
# Smart City IoT Analytics Pipeline Infrastructure

services:

  # -------------------------------------------------------
  # Apache Spark Master
  # -------------------------------------------------------
  spark-master:
    image: apache/spark-py:v3.4.0
    container_name: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/data
      - ./notebooks:/opt/spark/notebooks
    networks:
      - spark-network

  # -------------------------------------------------------
  # Apache Spark Worker 1
  # -------------------------------------------------------
  spark-worker-1:
    image: apache/spark-py:v3.4.0
    container_name: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_DIR: /tmp/spark-work
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/spark/data
    depends_on:
      - spark-master
    networks:
      - spark-network

  # -------------------------------------------------------
  # Apache Spark Worker 2
  # -------------------------------------------------------
  spark-worker-2:
    image: apache/spark-py:v3.4.0
    container_name: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_DIR: /tmp/spark-work
    ports:
      - "8082:8081"
    volumes:
      - ./data:/opt/spark/data
    depends_on:
      - spark-master
    networks:
      - spark-network

  # -------------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres-smartcity
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartcity
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Jupyter Notebook Server
  # -------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: jupyter.Dockerfile
    container_name: jupyter-smartcity
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: smartcity123
      SPARK_MASTER: spark://spark-master:7077
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data:/home/jovyan/work/data
      - ./src:/home/jovyan/work/src
      - ./config:/home/jovyan/work/config
    depends_on:
      - spark-master
      - postgres
    networks:
      - spark-network

  # -------------------------------------------------------
  # Grafana Dashboard
  # -------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-smartcity
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-worldmap-panel,grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
    networks:
      - spark-network

  # -------------------------------------------------------
  # Redis
  # -------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: redis-smartcity
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spark-network

  # -------------------------------------------------------
  # Adminer - PostgreSQL Management Tool
  # -------------------------------------------------------
  adminer:
    image: adminer
    container_name: adminer-smartcity
    ports:
      - "8083:8080"
    depends_on:
      - postgres
    networks:
      - spark-network


# ---------------------------------------------------------
# Persistent Volumes
# ---------------------------------------------------------
volumes:
  postgres_data:
    driver: local

  grafana_data:
    driver: local

  redis_data:
    driver: local


# ---------------------------------------------------------
# Docker Network
# ---------------------------------------------------------
networks:
  spark-network:
    driver: bridge